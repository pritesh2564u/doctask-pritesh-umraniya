services:
  # PostgreSQL Database (Free tier available)
  - type: pserv
    name: doctask-postgres
    plan: free
    ipAddress: private
    databaseName: doctask
    user: postgres
    
  # Backend API Service (Free tier)
  - type: web
    name: doctask-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - port: 8000
        protocol: HTTP
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doctask-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
    depends:
      - type: pserv
        name: doctask-postgres
        
  # Frontend Service (Free tier)
  - type: web
    name: doctask-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: Dockerfile
    ports:
      - port: 80
        protocol: HTTP
    envVars:
      - key: VITE_API_URL
        value: https://doctask-backend.onrender.com
      - key: NODE_ENV
        value: production
    depends:
      - type: web
        name: doctask-backend
