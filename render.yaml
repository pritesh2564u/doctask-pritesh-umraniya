services:
  # Backend API Service (Free tier)
  - type: web
    name: doctask-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        value: ""
      - key: GROQ_API_KEY
        value: ""
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
        
  # Frontend Service (Free tier)
  - type: web
    name: doctask-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://doctask-backend.onrender.com
      - key: NODE_ENV
        value: production
    depends:
      - type: web
        name: doctask-backend
