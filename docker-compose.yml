services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: doctask-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: doctask
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
