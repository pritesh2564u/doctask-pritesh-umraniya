services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: doctask-postgres
        restart: unless-stopped

        environment:
            POSTGRES_DB: doctask
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres

        ports:
            - "5433:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d doctask"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile

        container_name: doctask-backend
        restart: unless-stopped

        env_file:
            - ./backend/.env

        environment:
            DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/doctask

        depends_on:
            postgres:
                condition: service_healthy

        ports:
            - "8000:8000"

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile

        container_name: doctask-frontend
        restart: unless-stopped

        depends_on:
            backend:
                condition: service_started

        ports:
            - "5173:80"

    mcp:
        build:
            context: ./backend
            dockerfile: Dockerfile

        container_name: doctask-mcp
        restart: unless-stopped

        env_file:
            - ./backend/.env

        environment:
            DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/doctask

        depends_on:
            postgres:
                condition: service_healthy

        ports:
            - "8001:8000"

        command: ["python", "-m", "app.mcp.server"]

volumes:
    postgres_data:
